title: f10w-0x00
description: "Personal Dashboard, Cheatsheets & Technical Notes"
url: "https://f10w-0x00.github.io"
baseurl: ""

author:
  name: f10w-0x00
  github: f10w-0x00

markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:title/
future: true

plugins:
  - jekyll-seo-tag
  - jekyll-feed

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: "accompany"
    values:
      layout: "accompany"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
