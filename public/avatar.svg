<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" shape-rendering="geometricPrecision">
  <!-- 外围平滑圆角底板 -->
  <rect width="1000" height="1000" fill="#f0f0f0" rx="160" />

  <!-- f10w-0x00 专属 Identicon 5x5 对称阵列 (莫兰迪陶土暖色 #d1947c，带细微平滑倒角以消除锯齿像素感) -->
  <g fill="#d1947c">
    <!-- Row 0: . # # # . -->
    <rect x="260" y="100" width="160" height="160" rx="20" />
    <rect x="420" y="100" width="160" height="160" rx="20" />
    <rect x="580" y="100" width="160" height="160" rx="20" />

    <!-- Row 1: # # # # # -->
    <rect x="100" y="260" width="160" height="160" rx="20" />
    <rect x="260" y="260" width="160" height="160" rx="20" />
    <rect x="420" y="260" width="160" height="160" rx="20" />
    <rect x="580" y="260" width="160" height="160" rx="20" />
    <rect x="740" y="260" width="160" height="160" rx="20" />

    <!-- Row 2: . # # # . -->
    <rect x="260" y="420" width="160" height="160" rx="20" />
    <rect x="420" y="420" width="160" height="160" rx="20" />
    <rect x="580" y="420" width="160" height="160" rx="20" />

    <!-- Row 3: # . . . # -->
    <rect x="100" y="580" width="160" height="160" rx="20" />
    <rect x="740" y="580" width="160" height="160" rx="20" />

    <!-- Row 4: # . # . # -->
    <rect x="100" y="740" width="160" height="160" rx="20" />
    <rect x="420" y="740" width="160" height="160" rx="20" />
    <rect x="740" y="740" width="160" height="160" rx="20" />
  </g>
</svg>
